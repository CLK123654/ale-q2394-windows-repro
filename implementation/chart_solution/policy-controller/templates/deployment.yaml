apiVersion: apps/v1
kind: Deployment
metadata:
  name: policy-controller
  namespace: {{ .Values.service.namespace }}
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: policy-controller
  template:
    metadata:
      labels:
        app.kubernetes.io/name: policy-controller
    spec:
      serviceAccountName: policy-controller
      containers:
        - name: controller
          image: {{ .Values.controller.image }}
          env:
            - name: READ_VERSIONS
{{- if eq .Values.controller.mode "bridge" }}
              value: v1alpha1,v1beta1,v1
{{- else }}
              value: v1
{{- end }}
          ports:
            - name: webhook
              containerPort: 9443
